<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Level Up Gaming Accessories</title>
    <link rel="stylesheet" href="frontend/css/style.css">
    <link rel="stylesheet" href="frontend/css/shop.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body>

    <div class="stars-background" id="starsBackground"></div>

    <header class="header">
        <div class="container">
            <nav class="navbar">

                <a href="index.html" class="logo">
                    <img src="frontend/images/logo.svg" alt="Level Up Logo" class="logo-img">
            </a>

            <ul class="nav-menu" id="navMenu">
                    <li class="nav-item"><a href="index.html" class="nav-link" data-en="HOME" data-ru="ГЛАВНАЯ">ГЛАВНАЯ</a></li>
                    <li class="nav-item"><a href="shop.html" class="nav-link" data-en="SHOP" data-ru="МАГАЗИН">МАГАЗИН</a></li>
                    <li class="nav-item"><a href="about.html" class="nav-link" data-en="ABOUT US" data-ru="О НАС">О НАС</a></li>
                    <li class="nav-item"><a href="contact.html" class="nav-link" data-en="CONTACT" data-ru="КОНТАКТЫ">КОНТАКТЫ</a></li>
                </ul>

            <div class="nav-actions">

                <div class="auth-buttons" id="authButtons">
                    <a href="register.html" class="btn btn-primary" data-en="Registration" data-ru="Регистрация">Регистрация</a>
                    <a href="login.html" class="btn btn-primary" data-en="Login" data-ru="Вход">Вход</a>
                </div>

                <div class="profile-dropdown" id="profileDropdown" style="display: none;">
                        <button class="btn btn-profile" id="profileBtn">
                            <i class="fas fa-user"></i>
                            <span data-en="Profile" data-ru="Профиль">Профиль</span>
                        </button>
                        <div class="dropdown-menu" id="dropdownMenu">
                            <a href="profile.html" class="dropdown-item">
                                <i class="fas fa-user-circle"></i>
                                <span data-en="My Profile" data-ru="Мой профиль">Мой профиль</span>
                            </a>
                            <a href="orders.html" class="dropdown-item">
                                <i class="fas fa-box"></i>
                                <span data-en="My Orders" data-ru="Мои заказы">Мои заказы</span>
                            </a>
                            <a href="my-invoices.html" class="dropdown-item">
                                <i class="fas fa-file-invoice"></i>
                                <span data-en="My Invoices" data-ru="Мои счета">Мои счета</span>
                            </a>
                            <a href="profile.html#settings" class="dropdown-item">
                                <i class="fas fa-cog"></i>
                                <span data-en="Settings" data-ru="Настройки">Настройки</span>
                            </a>
                            <div class="dropdown-divider"></div>
                            <a href="#" class="dropdown-item" id="logoutBtn">
                                <i class="fas fa-sign-out-alt"></i>
                                <span data-en="Logout" data-ru="Выйти">Выйти</span>
                            </a>
                        </div>
                    </div>

                <div class="switcher language-switcher">
                    <button class="switcher-btn" id="langBtn">
                        <i class="fas fa-globe"></i>
                        <span id="currentLang">RU</span>
                    </button>
                    <div class="switcher-menu" id="langMenu">
                        <button class="switcher-option" data-lang="ru">RU</button>
                        <button class="switcher-option" data-lang="en">EN</button>
                    </div>
                </div>

                <div class="switcher currency-switcher">
                    <button class="switcher-btn" id="currencyBtn">
                        <i class="fas fa-dollar-sign"></i>
                        <span id="currentCurrency">USD</span>
                    </button>
                    <div class="switcher-menu" id="currencyMenu">
                        <button class="switcher-option" data-currency="usd">USD</button>
                        <button class="switcher-option" data-currency="eur">EUR</button>
                    </div>
                </div>

                <a href="cart.html" class="cart-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>

            </div>
        </nav>
    </div>
</header>

<section class="page-header">
    <div class="container">
        <h1>
            <span data-en="Gaming Shop" data-ru="Магазин Игровых Аксессуаров">
                Магазин Игровых Аксессуаров
            </span>
        </h1>
        <p data-en="Level up your setup with premium gaming gear"
           data-ru="Повысьте уровень своей настройки с помощью премиальных игровых аксессуаров">
            Повысьте уровень своей настройки с помощью премиальных игровых аксессуаров
        </p>
    </div>
</section>

<section class="shop-section">
    <div class="container">
        <div class="products-grid" id="productsContainer">
            <!-- Products will load here -->
        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p>&copy; 2026 Level Up Gaming Accessories.
            <span data-en="All rights reserved." data-ru="Все права защищены.">
                Все права защищены.
            </span>
        </p>
    </div>
</footer>

<script src="frontend/js/main.js"></script>
<script src="frontend/js/shop.js"></script>

</body>
</html>
