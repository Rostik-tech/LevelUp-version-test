<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Level Up Gaming</title>

    <link rel="stylesheet" href="frontend/css/style.css">
    <link rel="stylesheet" href="frontend/css/forms.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/svg+xml" href="frontend/images/logo1.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>

<body>
<!-- Cookie Banner -->
<div id="cookieBanner" class="cookie-banner">

    <div class="cookie-content">

        <p
        data-en="We use cookies and similar technologies to improve your browsing experience and analyze website traffic."
        data-ru="Мы используем файлы cookie и аналогичные технологии для улучшения работы сайта и анализа трафика."
        data-bg="Използваме бисквитки и подобни технологии, за да подобрим работата на сайта и да анализираме трафика.">
        We use cookies and similar technologies to improve your browsing experience and analyze website traffic.
        </p>

        <div class="cookie-buttons">

            <button id="acceptCookies" class="btn btn-primary"
            data-en="Accept"
            data-ru="Принять"
            data-bg="Приемам">
            Accept
            </button>

            <button id="declineCookies" class="btn btn-secondary"
            data-en="Decline"
            data-ru="Отклонить"
            data-bg="Отказ">
            Decline
            </button>

            <a href="privacy.html" class="cookie-link"
            data-en="Learn more"
            data-ru="Подробнее"
            data-bg="Повече информация">
            Learn more
            </a>

        </div>

    </div>

</div>
<div class="auth-page">
    <div class="auth-container">

        <form class="form-card" id="registerForm">
            <h1 class="form-title"
            data-en="Create Account"
            data-ru="Создать аккаунт"
            data-bg="Създаване на акаунт">
            Create Account
            </h1>

            <div id="formMessage"></div>

            <div class="form-group">
                <label
                data-en="Full Name"
                data-ru="Полное имя"
                data-bg="Пълно име">
                Full Name
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="fullName" name="fullName" class="form-input" required>
                </div>
            </div>

            <div class="form-group">
                <label
                data-en="Email"
                data-ru="Email"
                data-bg="Имейл">
                Email
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" name="email" class="form-input" required>
                </div>
            </div>

            <div class="form-group">
                <label
                data-en="Username"
                data-ru="Имя пользователя"
                data-bg="Потребителско име">
                Username
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-at input-icon"></i>
                    <input type="text" id="username" name="username" class="form-input" required>
                </div>
            </div>

            <div class="form-group">
                <label
                data-en="Password"
                data-ru="Пароль"
                data-bg="Парола">
                Password
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" class="form-input" required>
                    <i class="fas fa-eye password-toggle" onclick="togglePassword('password')"></i>
                </div>
            </div>

            <div class="form-group">
                <label
                data-en="Confirm Password"
                data-ru="Подтвердите пароль"
                data-bg="Потвърдете паролата">
                Confirm Password
                </label>      
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" required>
                    <i class="fas fa-eye password-toggle" onclick="togglePassword('confirmPassword')"></i>
                </div>
            </div>

                <button
                type="submit"
                class="btn btn-primary btn-large btn-block"
                data-en="Create Account"
                data-ru="Создать аккаунт"
                data-bg="Създаване на акаунт">
                Create Account
                </button>

            <div class="form-footer">
            <span
            data-en="Already have an account?"
            data-ru="Уже есть аккаунт?"
            data-bg="Вече имате акаунт?">
            Already have an account?
            </span>

            <a
            href="login.html"
            data-en="Login"
            data-ru="Войти"
            data-bg="Вход">
            Login
            </a>
            </div>
        </form>

    </div>
</div>

<script src="frontend/js/main.js"></script>

<script>
requireGuest();

function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}

document.getElementById("registerForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const formMessage = document.getElementById("formMessage");

    const username = document.getElementById("username").value.trim();
    const fullName = document.getElementById("fullName").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
            formMessage.className = "form-message error";
            formMessage.setAttribute("data-en", "Passwords do not match");
            formMessage.setAttribute("data-ru", "Пароли не совпадают");
            formMessage.setAttribute("data-bg", "Паролите не съвпадат");
            formMessage.textContent = "Пароли не совпадают";
            updatePageLanguage();
        return;
    }

    if (password.length < 8) {
        formMessage.className = "form-message error";
        formMessage.setAttribute("data-en", "Password must be at least 8 characters");
        formMessage.setAttribute("data-ru", "Пароль должен быть минимум 8 символов");
        formMessage.setAttribute("data-bg", "Паролата трябва да бъде поне 8 символа");
        formMessage.textContent = "Пароль должен быть минимум 8 символов";
        updatePageLanguage();
        return;
    }

    try {
        fetch("https://levelup-version-test-production.up.railway.app/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fullName, username, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
            formMessage.className = "form-message error";
            formMessage.setAttribute("data-en", data.message || "Registration error");
            formMessage.setAttribute("data-ru", data.message || "Ошибка регистрации");
            formMessage.setAttribute("data-bg", data.message || "Грешка при регистрация");
            formMessage.textContent = data.message || "Ошибка регистрации";
            updatePageLanguage();    
            return;
        }

        formMessage.className = "form-message success";
        formMessage.setAttribute("data-en", "Registration successful!");
        formMessage.setAttribute("data-ru", "Регистрация успешна!");
        formMessage.setAttribute("data-bg", "Регистрацията е успешна!");
        formMessage.textContent = "Регистрация успешна!";
        updatePageLanguage();

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1200);

    } catch {
        formMessage.className = "form-message error";
        formMessage.setAttribute("data-en", "Server connection error");
        formMessage.setAttribute("data-ru", "Ошибка соединения с сервером");
        formMessage.setAttribute("data-bg", "Грешка при връзка със сървъра");
        formMessage.textContent = "Ошибка соединения с сервером";
        updatePageLanguage();   
    }
});
</script>

</body>
</html>
