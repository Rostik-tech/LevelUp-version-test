// register.html
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Register - Level Up Gaming</title>

    <link rel="stylesheet" href="frontend/css/style.css">
    <link rel="stylesheet" href="frontend/css/forms.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-container">

        <form class="form-card" id="registerForm">
            <h1 class="form-title">Создать Аккаунт</h1>

            <div id="formMessage"></div>

            <div class="form-group">
                <label>Полное Имя</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="fullName" class="form-input" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" class="form-input" required>
                </div>
            </div>

            <div class="form-group">
                <label>Имя Пользователя</label>
                <div class="input-wrapper">
                    <i class="fas fa-at input-icon"></i>
                    <input type="text" id="username" class="form-input" required>
                </div>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" class="form-input" required>
                    <i class="fas fa-eye password-toggle" onclick="togglePassword('password')"></i>
                </div>
            </div>

            <div class="form-group">
                <label>Подтвердите Пароль</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="confirmPassword" class="form-input" required>
                    <i class="fas fa-eye password-toggle" onclick="togglePassword('confirmPassword')"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-large btn-block">
                Создать Аккаунт
            </button>

            <div class="form-footer">
                Уже есть аккаунт? <a href="frontend/login.html">Войти</a>
            </div>
        </form>

    </div>
</div>

<script src="frontend/js/main.js"></script>

<script>
requireGuest();

function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}

document.getElementById("registerForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const formMessage = document.getElementById("formMessage");

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        formMessage.className = "form-message error";
        formMessage.textContent = "Пароли не совпадают";
        return;
    }

    if (password.length < 8) {
        formMessage.className = "form-message error";
        formMessage.textContent = "Пароль должен быть минимум 8 символов";
        return;
    }

    try {
        const response = await fetch("http://localhost:5000/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, email, password })
        });

        const data = await response.json();

        if (!response.ok) {
            formMessage.className = "form-message error";
            formMessage.textContent = data.message || "Ошибка регистрации";
            return;
        }

        formMessage.className = "form-message success";
        formMessage.textContent = "Регистрация успешна!";

        setTimeout(() => {
            window.location.href = "login.html";
        }, 1200);

    } catch {
        formMessage.className = "form-message error";
        formMessage.textContent = "Ошибка соединения с сервером";
    }
});
</script>

</body>
</html>
