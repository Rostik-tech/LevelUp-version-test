<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Level Up Gaming</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body>

<div class="stars-background" id="starsBackground"></div>

<header class="header">
    <div class="container">
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="images/logo.svg" alt="Level Up" class="logo-img">
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" class="nav-link">ГЛАВНАЯ</a></li>
                <li><a href="shop.html" class="nav-link">МАГАЗИН</a></li>
                <li><a href="about.html" class="nav-link">О НАС</a></li>
                <li><a href="contact.html" class="nav-link">КОНТАКТЫ</a></li>
            </ul>

            <div class="nav-actions">
                <div class="auth-buttons" id="authButtons">
                    <a href="register.html" class="btn btn-primary">Регистрация</a>
                    <a href="login.html" class="btn btn-primary">Вход</a>
                </div>

                <div class="profile-dropdown" id="profileDropdown" style="display:none;">
                    <button class="btn btn-profile active" id="profileBtn">
                        <i class="fas fa-user"></i><span>Профиль</span>
                    </button>
                    <div class="dropdown-menu">
                        <a href="profile.html" class="dropdown-item">Мой профиль</a>
                        <a href="orders.html" class="dropdown-item">Мои заказы</a>
                        <div class="dropdown-divider"></div>
                        <a href="#" class="dropdown-item" id="logoutBtn">Выйти</a>
                    </div>
                </div>

                <a href="cart.html" class="cart-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
            </div>
        </nav>
    </div>
</header>

<section class="page-header">
    <div class="container">
        <h1 class="page-title"><span class="gradient-text">Мой профиль</span></h1>
        <p class="page-subtitle">Управление аккаунтом</p>
    </div>
</section>

<section class="profile-section">
    <div class="container">
        <div class="profile-layout">

            <aside class="profile-sidebar">
                <div class="profile-card">
                    <div class="profile-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <h3 id="profileName">Загрузка...</h3>
                    <p id="profileEmail">Загрузка...</p>
                </div>
            </aside>

            <div class="profile-main">

                <div class="profile-content-card">
                    <h2>Информация профиля</h2>
                    <form id="profileForm">
                        <div class="form-group">
                            <label>Полное имя</label>
                            <input type="text" id="fullNameInput" class="form-input-simple">
                        </div>

                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="emailInput" class="form-input-simple" disabled>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Сохранить изменения
                        </button>
                    </form>
                </div>

                <div class="profile-content-card">
                    <h2>Статистика</h2>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" id="totalOrders">0</div>
                            <div class="stat-label">Всего заказов</div>
                        </div>

                        <div class="stat-card">
                            <div class="stat-value" id="totalSpent">$0</div>
                            <div class="stat-label">Потрачено</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p>&copy; 2026 Level Up Gaming</p>
    </div>
</footer>

<script src="js/main.js"></script>
<script type="module" src="js/profile.js"></script>

</body>
</html>
