<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Level Up Gaming</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body>

<div class="stars-background" id="starsBackground"></div>

<header class="header">
    <div class="container">
        <nav class="navbar">

            <a href="index.html" class="logo">
                <img src="images/logo.svg" alt="Level Up Logo" class="logo-img">
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">Главная</a></li>
                <li><a href="shop.html">Магазин</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="contact.html">Контакты</a></li>
            </ul>

            <div class="nav-actions">

                <div id="authButtons">
                    <a href="register.html" class="btn btn-primary">Регистрация</a>
                    <a href="login.html" class="btn btn-primary">Вход</a>
                </div>

                <div id="profileDropdown" style="display:none;">
                    <button class="btn btn-profile" id="profileBtn">
                        <i class="fas fa-user"></i> Профиль
                    </button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <a href="profile.html">Мой профиль</a>
                        <a href="orders.html">Мои заказы</a>
                        <div class="dropdown-divider"></div>
                        <a href="#" id="logoutBtn">Выйти</a>
                    </div>
                </div>

                <a href="cart.html" class="cart-btn active">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>

                <button class="mobile-menu-toggle" id="mobileMenuToggle">
                    <span></span><span></span><span></span>
                </button>

            </div>
        </nav>
    </div>
</header>

<section class="page-header">
    <div class="container">
        <h1 class="page-title">
            <span class="gradient-text">Корзина Покупок</span>
        </h1>
        <p class="page-subtitle">
            Проверьте товары перед оформлением
        </p>
    </div>
</section>

<section class="cart-section">
    <div class="container">
        <div class="cart-layout">

            <div class="cart-items" id="cartItems"></div>

            <div class="cart-summary">
                <h2 class="summary-title">Итого</h2>

                <div class="summary-row">
                    <span>Подытог</span>
                    <span id="subtotal">$0.00</span>
                </div>

                <div class="summary-row">
                    <span>Доставка</span>
                    <span>Бесплатно</span>
                </div>

                <div class="summary-row">
                    <span>Налог</span>
                    <span id="tax">$0.00</span>
                </div>

                <div class="summary-divider"></div>

                <div class="summary-total">
                    <span>Итого</span>
                    <span id="total">$0.00</span>
                </div>

                <button class="btn btn-primary btn-large btn-block" id="checkoutBtn">
                    <i class="fab fa-paypal"></i>
                    Оформить через PayPal
                </button>

                <a href="shop.html" class="btn btn-outline btn-block">
                    Продолжить покупки
                </a>
            </div>

        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p>&copy; 2026 Level Up Gaming Accessories. Все права защищены.</p>
    </div>
</footer>

<script src="js/main.js"></script>
<script src="js/cart-page.js"></script>

<script>
requireUser();
</script>

</body>
</html>
