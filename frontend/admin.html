<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Level Up Gaming</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body>

<div class="stars-background"></div>

<header class="admin-header">
    <div class="container">
        <div class="admin-nav">
            <a href="index.html" class="logo">
                <img src="images/logo.svg" class="logo-img">
            </a>

            <h1 class="admin-title">
                <span class="gradient-text">Админ Панель</span>
            </h1>

            <button class="btn btn-outline" id="logoutBtn">
                Выйти
            </button>
        </div>
    </div>
</header>

<section class="admin-section">
    <div class="container">
        <div class="admin-layout">

            <aside class="admin-sidebar">
                <nav class="admin-menu">
                    <a href="#dashboard" class="admin-menu-link active">
                        <i class="fas fa-chart-line"></i>Панель управления
                    </a>
                    <a href="#products" class="admin-menu-link">
                        <i class="fas fa-box"></i>Товары
                    </a>
                    <a href="#orders" class="admin-menu-link">
                        <i class="fas fa-shopping-cart"></i>Заказы
                    </a>
                    <a href="#users" class="admin-menu-link">
                        <i class="fas fa-users"></i>Пользователи
                    </a>
                    <a href="#settings" class="admin-menu-link">
                        <i class="fas fa-cog"></i>Настройки
                    </a>
                </nav>
            </aside>

            <div class="admin-main">
                <h2>Добро пожаловать в админ-панель</h2>
                <p>Доступ разрешён только администраторам.</p>
            </div>

        </div>
    </div>
</section>

<script src="js/main.js"></script>

<script>
requireAdmin();

document.getElementById("logoutBtn").addEventListener("click", function () {
    logout();
});
</script>

</body>
</html>
