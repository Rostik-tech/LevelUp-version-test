<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Level Up Gaming</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body>

<div class="stars-background" id="starsBackground"></div>

<header class="header">
    <div class="container">
        <nav class="navbar">

            <a href="index.html" class="logo">
                <img src="images/logo.svg" class="logo-img">
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html" data-en="Home" data-ru="Главная">Главная</a></li>
                <li><a href="shop.html" data-en="Shop" data-ru="Магазин">Магазин</a></li>
                <li><a href="about.html" data-en="About" data-ru="О нас">О нас</a></li>
                <li><a href="contact.html" data-en="Contact" data-ru="Контакты">Контакты</a></li>
            </ul>

            <div class="nav-actions">

                <div id="authButtons">
                    <a href="register.html" class="btn btn-primary"
                       data-en="Registration" data-ru="Регистрация">
                        Регистрация
                    </a>
                    <a href="login.html" class="btn btn-primary"
                       data-en="Login" data-ru="Вход">
                        Вход
                    </a>
                </div>

                <div id="profileDropdown" style="display:none;">
                    <button class="btn btn-profile" id="profileBtn">
                        <i class="fas fa-user"></i>
                        <span data-en="Profile" data-ru="Профиль">Профиль</span>
                    </button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <a href="profile.html"
                           data-en="My Profile" data-ru="Мой профиль">
                            Мой профиль
                        </a>
                        <a href="orders.html"
                           data-en="My Orders" data-ru="Мои заказы">
                            Мои заказы
                        </a>
                        <div class="dropdown-divider"></div>
                        <a href="#" id="logoutBtn"
                           data-en="Logout" data-ru="Выйти">
                            Выйти
                        </a>
                    </div>
                </div>

                <a href="cart.html" class="cart-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>
            </div>

        </nav>
    </div>
</header>

<section class="page-header">
    <div class="container">
        <h1 class="page-title">
            <span class="gradient-text"
                  data-en="Checkout"
                  data-ru="Оформление заказа">
                Оформление заказа
            </span>
        </h1>
    </div>
</section>

<section class="checkout-section">
    <div class="container">
        <div class="checkout-layout">

            <!-- LEFT -->
            <div class="checkout-form-wrapper">
                <form class="checkout-form" id="checkoutForm">

                    <h2 class="section-title"
                        data-en="Shipping Information"
                        data-ru="Информация о доставке">
                        Информация о доставке
                    </h2>

                    <div class="form-grid">

                        <div class="form-group">
                            <label>ФИО</label>
                            <input type="text" id="fullName" required>
                        </div>

                        <div class="form-group">
                            <label>Телефон</label>
                            <input type="tel" id="phone" required>
                        </div>

                        <div class="form-group">
                            <label>Страна</label>
                            <input type="text" id="country" required>
                        </div>

                        <div class="form-group">
                            <label>Город</label>
                            <input type="text" id="city" required>
                        </div>

                        <div class="form-group full-width">
                            <label>Адрес</label>
                            <input type="text" id="address" required>
                        </div>

                        <div class="form-group">
                            <label>Почтовый индекс</label>
                            <input type="text" id="postalCode" required>
                        </div>

                        <div class="form-group">
                            <label>Квартира</label>
                            <input type="text" id="apartment">
                        </div>

                        <div class="form-group full-width">
                            <label>Комментарий к заказу</label>
                            <textarea id="orderNotes"></textarea>
                        </div>

                    </div>

                </form>
            </div>

            <!-- RIGHT -->
            <div class="order-summary">

                <h2 class="section-title">
                    Сводка заказа
                </h2>

                <div id="summaryItems" class="summary-items"></div>

                <div class="summary-line">
                    <span>Подытог</span>
                    <span id="subtotalAmount">$0.00</span>
                </div>

                <div class="summary-line">
                    <span>Налог (10%)</span>
                    <span id="taxAmount">$0.00</span>
                </div>

                <div class="summary-total">
                    <span>Итого</span>
                    <span id="totalAmount">$0.00</span>
                </div>

                <!-- 🔥 ВАЖНО: добавлен id для loading state -->
                <button
                    type="submit"
                    id="paypalButton"
                    class="btn btn-primary btn-large btn-block checkout-btn"
                    form="checkoutForm">
                    <i class="fab fa-paypal"></i>
                    <span>Оплатить через PayPal</span>
                </button>

                <a href="cart.html"
                   class="btn btn-outline btn-block">
                    Вернуться в корзину
                </a>

            </div>

        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p>
            © 2026 Level Up Gaming — Все права защищены.
        </p>
    </div>
</footer>

<script src="js/main.js"></script>
<script type="module" src="js/checkout.js"></script>

<script>
requireUser();
</script>

</body>
</html>
