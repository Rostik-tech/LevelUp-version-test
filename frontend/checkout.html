<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Level Up Gaming</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body>

<div class="stars-background" id="starsBackground"></div>

<header class="header">
    <div class="container">
        <nav class="navbar">

            <a href="index.html" class="logo">
                <img src="images/logo.svg" class="logo-img">
            </a>

            <ul class="nav-menu" id="navMenu">
                <li><a href="index.html">Главная</a></li>
                <li><a href="shop.html">Магазин</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="contact.html">Контакты</a></li>
            </ul>

            <div class="nav-actions">

                <div id="authButtons">
                    <a href="register.html" class="btn btn-primary">Регистрация</a>
                    <a href="login.html" class="btn btn-primary">Вход</a>
                </div>

                <div id="profileDropdown" style="display:none;">
                    <button class="btn btn-profile" id="profileBtn">
                        <i class="fas fa-user"></i> Профиль
                    </button>
                    <div class="dropdown-menu" id="dropdownMenu">
                        <a href="profile.html">Мой профиль</a>
                        <a href="orders.html">Мои заказы</a>
                        <div class="dropdown-divider"></div>
                        <a href="#" id="logoutBtn">Выйти</a>
                    </div>
                </div>

                <a href="cart.html" class="cart-btn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </a>

            </div>
        </nav>
    </div>
</header>

<section class="page-header">
    <div class="container">
        <h1 class="page-title">
            <span class="gradient-text">Оформление заказа</span>
        </h1>
    </div>
</section>

<section class="checkout-section">
    <div class="container">
        <div class="checkout-layout">

            <!-- LEFT SIDE -->
            <div class="checkout-form-wrapper">
                <form class="checkout-form" id="checkoutForm">

                    <h2>Информация о доставке</h2>

                    <input type="text" id="fullName" placeholder="ФИО" required>
                    <input type="tel" id="phone" placeholder="Телефон" required>
                    <input type="text" id="country" placeholder="Страна" required>
                    <input type="text" id="city" placeholder="Город" required>
                    <input type="text" id="address" placeholder="Адрес" required>
                    <input type="text" id="postalCode" placeholder="Почтовый индекс" required>
                    <input type="text" id="apartment" placeholder="Квартира">
                    <textarea id="orderNotes" placeholder="Комментарий к заказу"></textarea>

                </form>
            </div>

            <!-- RIGHT SIDE -->
            <div class="order-summary">

                <h2>Сводка заказа</h2>

                <div id="summaryItems"></div>

                <div class="summary-line">
                    Подытог:
                    <span id="subtotalAmount">$0.00</span>
                </div>

                <div class="summary-line">
                    Налог (10%):
                    <span id="taxAmount">$0.00</span>
                </div>

                <div class="summary-total">
                    Итого:
                    <span id="totalAmount">$0.00</span>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary btn-large btn-block"
                    form="checkoutForm">
                    Оплатить через PayPal
                </button>

                <a href="cart.html" class="btn btn-outline btn-block">
                    Вернуться в корзину
                </a>

            </div>

        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p>© 2026 Level Up Gaming</p>
    </div>
</footer>

<!-- MAIN -->
<script src="js/main.js"></script>

<!-- CHECKOUT (MODULE!) -->
<script type="module" src="js/checkout.js"></script>

<script>
requireUser();
</script>

</body>
</html>
