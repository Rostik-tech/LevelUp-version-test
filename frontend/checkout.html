<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Level Up Gaming</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/checkout.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body>

<div class="stars-background"></div>

<!-- Header -->
<header class="header">
    <div class="container">
        <nav class="navbar">
            <a href="index.html" class="logo">
                <img src="images/logo.svg" class="logo-img">
            </a>

            <ul class="nav-menu">
                <li><a href="index.html">Главная</a></li>
                <li><a href="shop.html">Магазин</a></li>
                <li><a href="about.html">О нас</a></li>
                <li><a href="contact.html">Контакты</a></li>
            </ul>

            <div class="nav-actions">

                <!-- Login/Register -->
                <div id="authButtons">
                    <a href="register.html" class="btn btn-primary">Регистрация</a>
                    <a href="login.html" class="btn btn-primary">Вход</a>
                </div>

                <!-- Profile -->
                <div id="profileDropdown" style="display:none;">
                    <button class="btn btn-profile">
                        <i class="fas fa-user"></i> Профиль
                    </button>
                    <div class="dropdown-menu">
                        <a href="profile.html">Мой профиль</a>
                        <a href="orders.html">Мои заказы</a>
                        <div class="dropdown-divider"></div>
                        <a href="#" id="logoutBtn">Выйти</a>
                    </div>
                </div>

                <a href="cart.html" class="cart-btn">
                    <i class="fas fa-shopping-cart"></i>
                </a>
            </div>
        </nav>
    </div>
</header>

<!-- Page Header -->
<section class="page-header">
    <div class="container">
        <h1 class="page-title">
            <span class="gradient-text">Оформление заказа</span>
        </h1>
    </div>
</section>

<!-- Checkout -->
<section class="checkout-section">
    <div class="container">
        <div class="checkout-layout">

            <!-- Form -->
            <div class="checkout-form-wrapper">
                <form class="checkout-form" id="checkoutForm">

                    <h2>Информация о доставке</h2>

                    <input type="text" id="fullName" placeholder="ФИО" required>
                    <input type="tel" id="phone" placeholder="Телефон" required>
                    <input type="text" id="country" placeholder="Страна" required>
                    <input type="text" id="city" placeholder="Город" required>
                    <input type="text" id="address" placeholder="Адрес" required>
                    <input type="text" id="postalCode" placeholder="Почтовый индекс" required>
                    <input type="text" id="apartment" placeholder="Квартира">
                    <textarea id="orderNotes" placeholder="Комментарий к заказу"></textarea>

                </form>
            </div>

            <!-- Summary -->
            <div class="order-summary">
                <h2>Сводка заказа</h2>

                <div id="summaryItems"></div>

                <div>
                    Подытог: <span id="subtotalAmount">$0.00</span>
                </div>
                <div>
                    Налог (10%): <span id="taxAmount">$0.00</span>
                </div>
                <div>
                    <strong>Итого: <span id="totalAmount">$0.00</span></strong>
                </div>

                <button type="submit"
                        class="btn btn-primary btn-large btn-block"
                        form="checkoutForm">
                    Оплатить через PayPal
                </button>

                <a href="cart.html">Вернуться в корзину</a>
            </div>

        </div>
    </div>
</section>

<footer class="footer">
    <div class="container">
        <p>© 2026 Level Up Gaming</p>
    </div>
</footer>

<!-- Scripts -->
<script src="js/main.js"></script>
<script type="module" src="js/checkout.js"></script>

<!-- 🔐 AUTH CONTROL -->
<script type="module">
import { getToken, requireAuth, logout } from "./js/auth.js";

/* Защита страницы */
requireAuth();

/* Navbar управление */
const token = getToken();

const authButtons = document.getElementById("authButtons");
const profileDropdown = document.getElementById("profileDropdown");
const logoutBtn = document.getElementById("logoutBtn");

if (token) {
    if (authButtons) authButtons.style.display = "none";
    if (profileDropdown) profileDropdown.style.display = "block";

    logoutBtn?.addEventListener("click", (e) => {
        e.preventDefault();
        logout();
    });
}
</script>

</body>
</html>
