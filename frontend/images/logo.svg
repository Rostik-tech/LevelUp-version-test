<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF00FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C700FF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- LVL Lightning Bolt Logo -->
  <g filter="url(#glow)">
    <!-- L -->
    <path d="M 15 20 L 25 20 L 25 70 L 45 70 L 45 80 L 15 80 Z" 
          fill="url(#logoGradient)" 
          stroke="url(#logoGradient)" 
          stroke-width="2"/>
    
    <!-- V with Lightning -->
    <path d="M 48 20 L 60 60 L 72 20 L 82 20 L 65 75 L 55 75 L 38 20 Z" 
          fill="url(#logoGradient)" 
          stroke="url(#logoGradient)" 
          stroke-width="2"/>
    
    <!-- L -->
    <path d="M 85 20 L 95 20 L 95 70 L 115 70 L 115 80 L 85 80 Z" 
          fill="url(#logoGradient)" 
          stroke="url(#logoGradient)" 
          stroke-width="2"/>
    
    <!-- Lightning Bolt Accent -->
    <path d="M 65 85 L 75 95 L 68 95 L 73 105 L 60 95 L 67 95 L 62 85 Z" 
          fill="url(#logoGradient)" 
          stroke="url(#logoGradient)" 
          stroke-width="1"/>
  </g>
</svg>