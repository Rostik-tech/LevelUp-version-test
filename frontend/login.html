<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Level Up Gaming</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="icon" type="image/svg+xml" href="images/logo1.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>

<body>
    <!-- Cookie Banner -->
<div id="cookieBanner" class="cookie-banner">

    <div class="cookie-content">

        <p
        data-en="We use cookies and similar technologies to improve your browsing experience and analyze website traffic."
        data-ru="Мы используем файлы cookie и аналогичные технологии для улучшения работы сайта и анализа трафика."
        data-bg="Използваме бисквитки и подобни технологии, за да подобрим работата на сайта и да анализираме трафика.">
        We use cookies and similar technologies to improve your browsing experience and analyze website traffic.
        </p>

        <div class="cookie-buttons">

            <button id="acceptCookies" class="btn btn-primary"
            data-en="Accept"
            data-ru="Принять"
            data-bg="Приемам">
            Accept
            </button>

            <button id="declineCookies" class="btn btn-secondary"
            data-en="Decline"
            data-ru="Отклонить"
            data-bg="Отказ">
            Decline
            </button>

            <a href="privacy.html" class="cookie-link"
            data-en="Learn more"
            data-ru="Подробнее"
            data-bg="Повече информация">
            Learn more
            </a>

        </div>

    </div>

</div>

<div class="auth-page">
    <div class="auth-container">

        <form class="form-card" id="loginForm">
            <h1 class="form-title"
        data-en="Welcome Back"
        data-ru="С возвращением"
        data-bg="Добре дошли отново">
        Welcome Back
        </h1>

            <div id="formMessage"></div>

            <div class="form-group">
                <label
                data-en="Email"
                data-ru="Email"
                data-bg="Имейл">
                Email
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="email" class="form-input" id="email" name="email" required>
                </div>
            </div>

            <div class="form-group">
                <label
                data-en="Password"
                data-ru="Пароль"
                data-bg="Парола">
                    Password
                </label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="form-input"  id="password" name="password" required>
                    <i class="fas fa-eye password-toggle" onclick="togglePassword('password')"></i>
                </div>
            </div>

            <button
            type="submit"
            class="btn btn-primary btn-large btn-block"
            data-en="Login"
            data-ru="Войти"
            data-bg="Вход">
            Login
            </button>

            <div class="form-footer">

            <span
            data-en="Don't have an account?"
            data-ru="Нет аккаунта?"
            data-bg="Нямате акаунт?">
            Don't have an account?
            </span>

            <a
            href="register.html"
            data-en="Register"
            data-ru="Зарегистрироваться"
            data-bg="Регистрация">
            Register
            </a>

            </div>
        </form>

    </div>
</div>

<script type="module" src="main.js"></script>

<script>
requireGuest();

function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}

document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const formMessage = document.getElementById("formMessage");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    console.log("LOGIN DATA:", { email, password });

    try {
        const response = await fetch("https://levelup-version-test-production.up.railway.app/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();
        console.log("RESPONSE:", data);

        if (!response.ok) {
            formMessage.className = "form-message error";
            formMessage.setAttribute("data-en", data.message || "Login error");
            formMessage.setAttribute("data-ru", data.message || "Ошибка входа");
            formMessage.setAttribute("data-bg", data.message || "Грешка при вход");
            formMessage.textContent = data.message || "Ошибка входа";
            updatePageLanguage();
            return;
        }

        // ✅ JWT
        localStorage.setItem("token", data.token);

        formMessage.className = "form-message success";
        formMessage.setAttribute("data-en", "Login successful!");
        formMessage.setAttribute("data-ru", "Вход выполнен успешно!");
        formMessage.setAttribute("data-bg", "Входът е успешен!");
        formMessage.textContent = "Вход выполнен успешно!";
        updatePageLanguage();

        setTimeout(() => {
            window.location.href = "index.html";
        }, 800);

    } catch (err) {
        console.error(err);

        formMessage.className = "form-message error";
        formMessage.setAttribute("data-en", "Server connection error");
        formMessage.setAttribute("data-ru", "Ошибка соединения с сервером");
        formMessage.setAttribute("data-bg", "Грешка при връзка със сървъра");
        formMessage.textContent = "Ошибка соединения с сервером";
        updatePageLanguage();   
    }
});
</script>

</body>
</html>
