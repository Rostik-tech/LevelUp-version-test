<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Login - Level Up Gaming</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-container">

        <form class="form-card" id="loginForm">
            <h1 class="form-title">С Возвращением</h1>

            <div id="formMessage"></div>

            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="email" class="form-input" id="email" required>
                </div>
            </div>

            <div class="form-group">
                <label>Пароль</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" class="form-input" id="password" required>
                    <i class="fas fa-eye password-toggle" onclick="togglePassword('password')"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-large btn-block">
                Войти
            </button>

            <div class="form-footer">
                Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </div>
        </form>

    </div>
</div>

<script src="js/main.js"></script>

<script>
requireGuest();

function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}

document.getElementById("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const formMessage = document.getElementById("formMessage");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
        const response = await fetch("http://localhost:5000/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
            formMessage.className = "form-message error";
            formMessage.textContent = data.message || "Ошибка входа";
            return;
        }

        // Сохраняем JWT
        localStorage.setItem("token", data.token);

        formMessage.className = "form-message success";
        formMessage.textContent = "Вход выполнен успешно!";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 800);

    } catch {
        formMessage.className = "form-message error";
        formMessage.textContent = "Ошибка соединения с сервером";
    }
});
</script>

</body>
</html>
