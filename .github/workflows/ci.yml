name: API Tests CI

on:
  push:
    branches:
      - old-version

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman

      - name: Run API tests
        run: newman run tests/api/auth.postman_collection.json

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Force Railway redeploy (debug)
        run: |
          echo "Starting deploy..."

          RESPONSE=$(curl -s -X POST https://backboard.railway.app/graphql \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { deploymentCreate(input: { serviceId: \"b663cae9-8114-4d46-8e27-9c3db2fc8d9c\" }) { id } }"}')

          echo "Response from Railway:"
          echo "$RESPONSE"