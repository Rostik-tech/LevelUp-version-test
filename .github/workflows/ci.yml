name: API Tests CI

on:
  push:
    branches:
      - old-version

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Newman
        run: npm install -g newman

      - name: Run API tests
        run: newman run tests/api/auth.postman_collection.json

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy to Railway via API
        run: |
          curl -X POST https://backboard.railway.app/graphql \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { deploy(projectId: \"bb4c0f08-198f-4047-b91e-b4fa0d38ce89\") }"}'